<script>
// Renders one "page" tab from site-data.json (?tab=<id>): each item is a
// row with its title, a [Get here] button linking to the item's link, and
// a "Tips: ..." line under the title — the pattern from Piyush's sketch.
(function () {
  var listEl = document.getElementById('tabList');
  var statusEl = document.getElementById('listStatus');
  var titleEl = document.getElementById('listTitle');

  function tabHref(tab) {
    if (!tab) return '#';
    if (tab.type === 'page') return 'list.html?tab=' + encodeURIComponent(tab.id || '');
    return tab.url || '#';
  }

  function renderNav(tabs) {
    var nav = document.querySelector('header.site nav.links');
    if (!nav || !tabs || !tabs.length) return;
    nav.textContent = '';
    tabs.forEach(function (tab) {
      var a = document.createElement('a');
      a.href = tabHref(tab);
      a.textContent = tab.label || '';
      nav.appendChild(a);
    });
  }

  function showStatus(msg) {
    listEl.textContent = '';
    var p = document.createElement('p');
    p.className = 'no-apps';
    p.textContent = msg;
    listEl.appendChild(p);
  }

  function renderItems(tab) {
    titleEl.textContent = tab.label || 'List';
    document.title = (tab.label || 'List') + ' — VYRO';
    var items = tab.items || [];
    if (!items.length) {
      showStatus('No items here yet — check back soon.');
      return;
    }
    listEl.textContent = '';
    items.forEach(function (item) {
      var art = document.createElement('article');
      art.className = 'app-row';

      var info = document.createElement('div');
      info.className = 'app-info';
      var h3 = document.createElement('h3');
      h3.textContent = item.title || '';
      info.appendChild(h3);
      if (item.tips) {
        var tips = document.createElement('p');
        tips.textContent = 'Tips: ' + item.tips;
        info.appendChild(tips);
      }
      art.appendChild(info);

      if (item.link) {
        var a = document.createElement('a');
        a.className = 'btn get';
        a.href = item.link;
        a.textContent = 'Get here';
        if (/^https?:\/\//i.test(item.link)) {
          a.target = '_blank';
          a.rel = 'noopener';
        }
        art.appendChild(a);
      }
      listEl.appendChild(art);
    });
  }

  var params = new URLSearchParams(window.location.search);
  var tabId = params.get('tab') || '';

  fetch('site-data.json', { cache: 'no-store' })
    .then(function (resp) {
      if (!resp.ok) throw new Error('site-data.json: HTTP ' + resp.status);
      return resp.json();
    })
    .then(function (data) {
      if (!data || typeof data !== 'object') throw new Error('bad data');
      try { renderNav(data.tabs); } catch (e) { /* keep static nav */ }
      var tab = null;
      (data.tabs || []).forEach(function (t) {
        if (t.id === tabId) tab = t;
      });
      if (!tab || tab.type !== 'page') {
        titleEl.textContent = 'List not found';
        document.title = 'List not found — VYRO';
        showStatus('This list is not available. Head back to the homepage to explore VYRO apps.');
        return;
      }
      renderItems(tab);
    })
    .catch(function () {
      showStatus('Could not load this list — please check your connection and try again.');
    });
})();
</script>
</body>
